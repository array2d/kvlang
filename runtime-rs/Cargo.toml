[package]
name = "kvlang-rs"
version = "0.1.0"
edition = "2021"
description = "功能完整的 kvlang runtime：模式2 主导执行 + 纯净 rwir stdlib（term/json/http/kvlanglayout）"

[lib]
name = "kvlang_rs"
path = "src/lib.rs"

[[bin]]
name = "kvlang"
path = "src/main.rs"

[features]
# #493：全部自有 .so 以字节嵌入，启动 memfd+dlopen 从内存加载（不落盘、不 exec）。
embed = []

[dependencies]
libc = "0.2"
serde_json = "1"
ureq = { version = "2", features = ["gzip"] }
rustyline = "15"
