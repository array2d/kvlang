<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kvlang stdlib</title>
    <meta
      name="description"
      content="kvlang 标准库文档。本页客户端渲染；Agent/爬虫请抓生数据源，见页面底部或 <link rel=alternate>。"
    />
    <link rel="icon" type="image/svg+xml" href="/img/kvlang-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#D07E64" />
    <!-- Agent 源清单：均跟随仓库默认分支 (HEAD) -->
    <link
      rel="alternate"
      type="application/json"
      title="stdlib 源清单 (GitHub trees API, 过滤 stdlib/*.kv)"
      href="https://api.github.com/repos/array2d/kvlang/git/trees/HEAD?recursive=1"
    />
    <script type="module" src="/src/stdlib/main.ts"></script>
  </head>
  <body>
    <header id="topbar">
      <a id="brand" href="#/"><img src="/img/kvlang-mark.svg" alt="" width="22" height="22" />kvlang <span>stdlib</span></a>
      <span id="branch" class="branch"></span>
      <a class="agent-link" href="#agent-sources" title="给 Agent/爬虫的源清单">⚙ Agent 源</a>
      <button id="theme" title="切换主题">◐</button>
    </header>
    <div id="app">
      <nav id="sidebar"><div class="loading">加载目录…</div></nav>
      <main id="content"><div class="loading">选择左侧文档</div></main>
    </div>

    <!-- 静态源清单：不依赖 JS，curl/WebFetch/爬虫抓 HTML 即可见 -->
    <footer id="agent-sources">
      Agent/爬虫源 (HEAD 跟随默认分支)：<a
        href="https://api.github.com/repos/array2d/kvlang/git/trees/HEAD?recursive=1"
        >目录清单 API</a
      >
      · 单文件全文 <code>raw.githubusercontent.com/array2d/kvlang/HEAD/&lt;path&gt;</code> ·
      <a href="https://github.com/array2d/kvlang/tree/HEAD/stdlib">可浏览目录</a>
    </footer>
  </body>
</html>
