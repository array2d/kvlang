[package]
name = "kvlang-layout"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "kvlang 语法检查 + 布局工具（parser/lower/layoutcode），只依赖 kvspace-durable 的 C ABI"

[lib]
name = "kvlanglayout"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.11"

[features]
# layout 的类型统计诊断输出（原 KVLANG_LAYOUT_STATS 环境变量）。
#
# 诊断能力不是产品能力：**默认关闭**，发布产物不带这段代码。需要时显式
# `cargo build --release --features layout-stats`。关闭时统计代码整块被
# `#[cfg]` 编掉，不留 `if false` 分支。
layout-stats = []
