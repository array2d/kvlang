[package]
name = "pathlang-layout"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "pathlang 语法检查 + 布局工具（parser/lower/layoutcode），只依赖 pathspace-durable 的 C ABI"

[lib]
name = "pathlanglayout"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.11"

[features]
layout-stats = []
