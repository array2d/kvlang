[package]
name = "pathlang-layout"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "pathlang syntax checker and layout tool (parser/lower/layoutcode), depending only on the pathspace-durable C ABI"

[lib]
name = "pathlanglayout"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.11"

[features]
layout-stats = []
