# 原地新增/改名后已存在的路径：不来自 renames.paths 的旧路径，但属于现行拓扑，
# 不再触发 unmapped-old-topology。renamed_from 指回 renames.paths 的 from；
# 全新文件写 predecessor: none。
new_paths:
  - {path: runtimec2/include/vmkv_rwirhandler.hpp, renamed_from: runtimec2/include/vmkv_native.hpp}
  - {path: runtimec2/src/vmkv_rwirruntimeimpl.cpp, renamed_from: runtimec2/src/vmkv_native.cpp}
  - {path: runtimec2/include/binir_dump.hpp, predecessor: none}
  - {path: runtimec2/src/binir_dump.cpp, predecessor: none}

rules:
  - id: old-namespace-declaration
    kind: regex
    pattern: '\bnamespace\s+(?:kvlang::runtimec2::)?(?:bin|rwir)\b'
    message: old bin/rwir namespace declaration
  - id: old-namespace-qualifier
    kind: regex
    pattern: '\b(?:bin|rwir)::'
    message: old bin/rwir namespace qualifier
  - id: old-core-type
    kind: regex
    pattern: '\b(?:Segment|CInsn|RegDesc|LitFast|FReg|FrameCtx|RunResult|Vmkv|VmBin|NativeCtx|NativeFn)\b'
    message: old root/component type
  - id: old-jit-type
    kind: regex
    pattern: '\bJit[A-Za-z0-9_]*\b'
    message: Jit-prefixed type must move under vmjit with its canonical name
  - id: old-function
    kind: regex
    pattern: '\b(?:build_segment|cached_segment|clear_segment_cache|cached_insn|find_myrwircap|op_name|parse_pc|find_native|has_native|emit_arch|bootstrap_impl|execute_vthread_impl)\b'
    message: old private function name
  - id: old-instruction-native-field
    kind: regex
    pattern: '\b(?:fn_fold|native_ready|native_noprefetch)\b'
    message: removed Instruction fold/native fields; use handler (RwirHandlerId)
  - id: bare-jit-identifier
    kind: regex
    pattern: '\bjit_[A-Za-z0-9_]*\b'
    message: bare jit_ identifier must move under vmjit
  - id: old-rwir-table-symbol
    kind: regex
    pattern: '\b(?:myrwircaps|kMyrwircapsN)\b'
    message: old RWIR capability table symbol
  - id: old-rc2-config
    kind: regex
    pattern: '\bRC2_[A-Z0-9_]+\b'
    message: old RC2 macro or environment variable
  - id: old-abi-export-macro
    kind: regex
    pattern: '\bKV2_EXPORT\b'
    message: old private ABI export macro
  - id: old-jit-cmake-variable
    kind: regex
    pattern: '\bJIT_ARCH_SRC\b'
    message: old JIT backend CMake variable
  - id: generic-internal-target
    kind: regex
    pattern: '\bruntimec2_(?:core|exec|ir|jit)\b'
    message: generic internal target hides vmkv/vmbin/vmjit ownership
  - id: old-ctest-name
    kind: regex
    pattern: '\bc2_(?:rwir_table|impl_db_check|m1_smoke|kvspace_dynamic_ops|symbol_parity|segment_shape_dump)\b'
    message: old CTest name
  - id: old-tool-or-test-name
    kind: regex
    pattern: '\b(?:check_impl_consistency\.py|segment_shape_dump(?:\.cpp)?|binir_format_probe\.py|real_segment_corpus\.py|rwir_table(?:\.cpp)?|kvspace_dynamic_ops\.sh|m1_smoke|symbols\.sh)\b'
    message: old tool, test, or executable name
  - id: old-private-include
    kind: regex
    pattern: '["<](?:codeseg|jit|rwir|vmbin|vmkv|vmkv_native)\.hpp[">]'
    message: old flat private include
  - id: root-namespace-product-type
    kind: root_namespace_type
    namespace: 'kvlang::runtimec2'
    message: product type declared directly in root runtimec2 namespace

compatibility_allowances:
  - rule: old-rc2-config
    path: runtimec2/runtime/environment.hpp
    max_count: 8
    expires_at_phase: 6
    reason: centralized legacy environment compatibility table

unmapped_path_rules:
  - id: unmapped-old-topology
    pattern: '^runtimec2/(?:include|src)(?:/|$)'
    message: file in old include/src topology is absent from rename manifest

baseline_debt: []

# 下游约定（#583 步骤 1）：Instruction::rwir_id 是联合 id 域。
#   < 0x8000      → myrwircaps 下标（kMyrwircapsN = 305）
#   >= 0x8000     → Program::extra_rwir_names[rwir_id - 0x8000]（扩展算子 handoff）
#   0xFFFF        → 构造默认值，正常建段不产出
# 取名只走 instruction_name()；判等只走 instruction_is()/RwirId 数值比较；
# 禁止 myrwircaps[ins.rwir_id] 直接下标（扩展 id 越界）与恢复字符串比较。
notes:
  - id: instruction-rwir-id-union
    scope: runtimec2
    detail: >-
      rwir_id < 0x8000 is a myrwircaps index; >= 0x8000 indexes
      Program::extra_rwir_names; 0xFFFF is the unset default. Resolve names via
      instruction_name() only.
