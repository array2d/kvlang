schema: kvlang.runtimec2.trunk-rename.v1
authority: workspace/583/runtimec2-trunk-rename-plan.md
canonical_trunk: [vmkv, vmbin, vmjit]
service_namespaces: [runtime]
phases: [0, 1, 2, 3, 4, 5]

scan:
  roots:
    - runtimec2
    - docs
    - Makefile
    - .github/workflows
  text_suffixes:
    - .c
    - .cc
    - .cpp
    - .cxx
    - .h
    - .hpp
    - .py
    - .sh
    - .cmake
    - .md
    - .mmd
    - .txt
    - .json
    - .yaml
    - .yml
  text_names: [CMakeLists.txt, Makefile]
  binary_suffixes: [.a, .bin, .dll, .dylib, .exe, .gif, .jpeg, .jpg, .o, .pdf, .png, .so, .svg, .wasm]
  excluded_globs:
    - .git/**
    - workspace/**
    - build/**
    - '**/build/**'
    - '**/CMakeFiles/**'
    - '**/target/**'
    - '**/__pycache__/**'
    - '**/node_modules/**'
    - site/dist/**
    - benchmark/results/**
    - tutorial/test_failures.csv
    - docs/c+keyto64/**
    - docs/runtimec-compiler-layers.md
    - runtimec2/tools/architecture/**
    - runtimec2/tests/runtime/trunk_names_test.py
    # 陈旧图源：停留在改名前的 Segment/CInsn/NativeCtx 口径，待按新结构重生成。
    - docs/diagrams/runtimec2-class.mmd
  generated_globs:
    - docs/diagrams/*.png
    - docs/diagrams/*.svg
    - docs/diagrams/*.pdf

protected_files:
  - path: runtimec2/tools/real_segment_corpus.py
    sha256: 288eebbb10ee2aba4f13bd9fede1a2dbc3fac77c9a4faf5eaa1a046f983f5b82
    protect_through_phase: 4
  - path: runtimec2/tests/real_segment_corpus_test.py
    sha256: 64d033163bf12c65624925ddd982fa8827cb14966e17a537736a51108da8adc8
    protect_through_phase: 4

permanent_allowlist:
  targets: [kvlang_runtimec2, runtimec2]
  c_symbols:
    - kvlangDefRwir
    - kvlangRwirextHandoff
    - kvlangRwirextNextPc
    - kvlangRwirextParams
    - kvlangRwirextResolveRead
    - kvlangRwirextResolveReadPath
    - kvlangRwirextResolveWrite
    - kvlangLangtypeValid
    - kvlangLangtypeMatch
    - kvlangRuntimeConnect
    - kvlangRuntimeDisconnect
    - kvlangRuntimeExecutePc
    - kvlangRuntimeKvspaceHandle
    - kvlangRuntimeBootstrap
    - kvlangRuntimeExecuteVthread
    - kvlangRuntimeExecute
  external_platform_macros:
    - __aarch64__
    - __APPLE__
    - __arm__
    - __x86_64__
    - KVSPACE_XVALUE_HEAD_LEN

renames:
  paths:
    - {from: runtimec2/include/codeseg.hpp, to: runtimec2/vmbin/legacy_program.hpp, owner: vmbin, expires_at_phase: 5}
