name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: 下载 ABI 依赖
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      - name: 构建
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: 构建产物
        run: cmake --build build -j"$(nproc)"
      - name: 单元测试
        run: ctest --test-dir build --output-on-failure
      - name: 断言测试数非零
        run: |
          n=$(ctest --test-dir build -N | grep -cE "^ *Test +#")
          echo "ctest 发现 $n 个测试"
          test "$n" -gt 0
      - name: CLI smoke
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build"
          d=$(mktemp -d)
          export KVSPACE="shm://$d/smoke.shm"
          ./cli/target/release/kvspace mkindex /d/
          ./cli/target/release/kvspace list /
          ./cli/target/release/kvspace tree /
