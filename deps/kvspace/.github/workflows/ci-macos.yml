name: ci-macos
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建依赖 blockmalloc / slotsboxmalloc（macOS 无预编译 ABI，源码装 /usr/local）
        run: |
          set -euo pipefail
          for repo in blockmalloc slotsboxmalloc; do
            git clone --depth 1 "https://github.com/array2d/$repo.git" "/tmp/$repo"
            cmake -S "/tmp/$repo" -B "/tmp/$repo/build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
            cmake --build "/tmp/$repo/build" -j
            sudo cmake --install "/tmp/$repo/build"
          done
      - name: 构建
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j
      - name: 单元测试
        run: ctest --test-dir build --output-on-failure
      - name: 断言测试数非零
        run: |
          n=$(ctest --test-dir build -N | grep -cE "^ *Test +#")
          echo "ctest 发现 $n 个测试"
          test "$n" -gt 0
      - name: 安装（验证安装规则）
        run: sudo cmake --install build
      - name: 连通性冒烟（单库直调，无 dlopen）
        run: |
          cat > /tmp/conn.c <<'EOF'
          int main(void) {
              void *h = kvspaceConnect("shm:///tmp/ks_ci_macos");
              printf("connect shm:// → %p\n", h);
              if (h) kvspaceClose(h);
              return h ? 0 : 1;
          }
          EOF
          cc /tmp/conn.c -o /tmp/conn -I/usr/local/include -L/usr/local/lib/kvspace -lkvspace
          DYLD_FALLBACK_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/kvspace /tmp/conn
