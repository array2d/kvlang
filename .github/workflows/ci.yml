name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v4

      - name: 工具链
        run: |
          set -euo pipefail
          cmake --version | head -1
          cargo --version
          gcc --version | head -1
          python3 --version

      - name: 构建全部产物
        run: make artifact

      - name: 产物清单
        run: |
          set -euo pipefail
          test -x bin/pathlangrun
          test -x bin/kv_runner
          test -x bin/pathlanglayout
          test -f lib/libpathspace.so.1
          test -f lib/libpathlanglayout.so
          test -f lib/libpathlang_runtime.so
          test -f lib/libpathlang_xvalue.a
          ls -1 bin lib

      - name: runtimec ctest
        run: ctest --test-dir build/artifact-runtimec --output-on-failure

      - name: benchmark（shm，10 个 case）
        run: python3 benchmark/run.py --backends shm --repeat 1 --no-write | tee /tmp/bench.txt

      - name: 全部 case valid
        run: |
          set -euo pipefail
          n=$(grep -cE 'True$' /tmp/bench.txt || true)
          echo "valid rows: $n"
          test "$n" -eq 30
