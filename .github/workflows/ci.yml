name: ci
on: [push, pull_request, repository_dispatch]
jobs:
  # #622 阶段 0：runtimec（C11 新底座）独立构建与门禁。
  # 与 test-* / typed-debug / single 完全解耦：只读 include/kvspace 头，不碰
  # runtimec2、不跑 tutorial，所以现有红灯不会污染本 job 的判读。
  runtimec:
    runs-on: ubuntu-latest
    name: runtimec
    steps:
      - uses: actions/checkout@v4
      - name: 取 kvspace 头（runtimec 只依赖 include/kvspace）
        run: |
          set -euo pipefail
          # 只取头文件，不跑 ci/deps.sh：那一步依赖 gh 下载 ABI release，
          # 与 runtimec 无关，失败会污染本 job 的判读。版本与 deps.json 钉死。
          ver=$(python3 -c 'import json;print(json.load(open("deps.json"))["kvspace"])')
          echo "kvspace $ver"
          git clone --depth 1 --branch "$ver" \
            https://github.com/array2d/kvspace /tmp/kvspace
          mkdir -p include
          cp -R /tmp/kvspace/include/kvspace include/
          test -f include/kvspace/xvalue_head.h
      - name: 守卫：runtimec 不得依赖 runtimec2 / runtime
        run: |
          set -euo pipefail
          # grep 的 0=命中、1=无命中、2=执行错误；三者必须分开判，不能用 `! grep`
          # （它会把执行错误也翻成成功）。
          guard() {
            local rc=0
            grep -rn "$@" > /tmp/runtimec-guard.txt || rc=$?
            case $rc in
              0) echo "runtimec 引用了已删除的树："; cat /tmp/runtimec-guard.txt; return 1 ;;
              1) return 0 ;;
              *) echo "守卫执行失败 rc=$rc"; return 1 ;;
            esac
          }
          guard --include=*.c --include=*.h --include=*.txt --include=*.cmake \
            -E '(^|[/"<])(runtimec2|runtime)/' runtimec
          guard --include=CMakeLists.txt -E 'runtimec2|\.\./runtime/' runtimec
      - name: 配置与构建（Debug，-Werror）
        run: |
          set -euo pipefail
          cmake -S runtimec -B /tmp/kvlang-runtimec-build \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build /tmp/kvlang-runtimec-build --parallel
      - name: ctest
        run: ctest --test-dir /tmp/kvlang-runtimec-build --output-on-failure
      - name: 架构校验（三个结构脚本，各自非零退出即失败）
        run: |
          set -euo pipefail
          # check_behavior_matrix.py 只扫 specification/ 规范树与 manifest，
          # 不扫源码：它不会因源码改动变红，也不会拦下源码里新增的、
          # 未进矩阵的行为决策。不要把它当成「已覆盖所有架构漂移」。
          python3 runtimec/tools/architecture/check_layers.py \
            --source-root "$PWD"
          python3 runtimec/tools/architecture/check_names.py \
            --source-root "$PWD"
          python3 runtimec/tools/architecture/check_behavior_matrix.py \
            --source-root "$PWD"
      - name: 导出符号校验
        run: |
          set -euo pipefail
          python3 runtimec/tools/architecture/check_exports.py \
            --library /tmp/kvlang-runtimec-build/libkvlang_runtimec_scaffold.so \
            --manifest runtimec/interface/exports.txt
      - name: RWIR manifest 校验
        run: |
          set -euo pipefail
          # 断言注册表 == manifest ∪ 缺口（双向）、identifier/opid/opcode 无重复、
          # decision 在矩阵存在、无第二份签名表、两个产物与生成结果字节一致。
          # 该脚本以 gcc -E 读 runtime/src/mywircaps.c 作为输入（旧 C runtime 的
          # 注册表是唯一事实源），这只是只读消费，不是 runtimec 的构建依赖。
          if [ ! -f runtimec/tools/architecture/generate_rwir_catalog.py ]; then
            echo "::error::generate_rwir_catalog.py 未提交到本 commit（coding1 归属）"
            exit 1
          fi
          gcc --version | head -1
          python3 runtimec/tools/architecture/generate_rwir_catalog.py \
            --check --root "$PWD"

  test:
    runs-on: ubuntu-latest
    name: test-${{ matrix.backend.name }}
    strategy:
      fail-fast: false
      matrix:
        backend:
          - { name: shm, dsn: "shm:///tmp/kvlang_ci_shm.shm" }
          - { name: fs,  dsn: "fs:///tmp/kvlang_ci_fs" }
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ABI 依赖
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      - name: 构建
        run: |
          # 产物全部落 repo：bin/ 可执行、lib/ 库（不装 /usr）。
          make runtimec2
          cmake --build build/runtimec2 -j
          make runtime      # C runtime（可选 A/B 臂；c2_symbol_parity 需要同目录兄弟库）
          make layout       # → bin/kvlanglayout + lib/libkvlanglayout.so
          make byteseek     # → bin/byteseek
      - name: runtimec2 ctest
        run: |
          export PATH="$PWD/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/lib:$PWD/lib/kvspace:$PWD/bin"
          KVLANG_BIN="$PWD/bin/byteseek" ctest --test-dir build/runtimec2 --output-on-failure
      - name: 测试 (${{ matrix.backend.name }})
        env: { KVSPACE: "${{ matrix.backend.dsn }}", KV_CASE_TIMEOUT: "600" }
        run: |
          # repo 即 prefix：tutorial 依赖 bin/ 里的 kvspace CLI 与 lib/ 里的库。
          export PATH="$PWD/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/lib:$PWD/lib/kvspace:$PWD/bin"
          python3 tutorial/test.py

  typed-debug:
    runs-on: ubuntu-latest
    name: typed-debug
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ABI 依赖
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      - name: 构建 layout + byteseek（提供 bin/byteseek、kvlanglayout）
        run: |
          mkdir -p bin
          make runtimec2
          make runtime
          make layout
          make byteseek
      - name: 构建 KV_DEBUG_TYPES runtime
        run: |
          cmake -S runtime -B build/runtime-debug -DCMAKE_BUILD_TYPE=Release \
            -DKVLANG_DEBUG_TYPES=ON
          cmake --build build/runtime-debug --target kvlang_runtime -j
      - name: typed violation（必须真跑，不能 SKIP）
        run: |
          test -f "$PWD/lib/libkvlang_runtime.so"
          KVLANG_DEBUG_RUNTIME_LIB="$PWD/lib/libkvlang_runtime.so" \
          KVLANG_LAYOUT_BIN="$PWD/bin/kvlanglayout" \
          KVLANG_TERM_BIN="$PWD/bin/byteseek" \
          bash runtime/tests/isa_typed_violation.sh
      - name: 156 entry conformance
        run: |
          KVLANG_LAYOUT_BIN="$PWD/bin/kvlanglayout" \
          KVLANG_TERM_BIN="$PWD/bin/byteseek" \
          python3 runtime/tests/isa_conformance.py

  # #493 单一二进制：嵌入 .so + memfd dlsym。构建、无自有库/rpath 校验、冒烟。
  single:
    runs-on: ubuntu-latest
    name: single-binary
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ABI 依赖
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      - name: 构建 kvspace 前端（含 RTLD_NOLOAD 能力标记；v0.3.18 发布版没有）
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/array2d/kvspace /tmp/kvspace-src
          cmake -S /tmp/kvspace-src -B /tmp/kvspace-src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kvspace-src/build -j
          # 守卫：前端必须带 RTLD_NOLOAD 能力标记，否则单文件会静默回退到系统目录后端
          grep -aq "kvspace:embed-noload" /tmp/kvspace-src/build/libkvspace.so.1
      - name: 启动本地 redis（redis:// 冒烟）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server
          sudo redis-server --daemonize yes --port 6379
          sleep 1
      - name: 构建 runtime + layout（单文件 payload 里的两份）
        run: |
          make runtimec2
          make layout
      - name: 构建单一二进制
        run: FRONTEND_SO=/tmp/kvspace-src/build/libkvspace.so.1 make single
      - name: 校验：运行时只有 KVSPACE 一个环境变量
        run: |
          set -euo pipefail
          # 单二进制不得在运行期 setenv 任何 KVSPACE*（只认 KVSPACE 选后端）
          ! grep -rn 'setenv.*KVSPACE' byteseek/src/
      - name: 校验：无自有 .so、无 RPATH
        run: |
          set -euo pipefail
          ldd bin/byteseek | tee /tmp/ldd.txt
          ! grep -E 'kvspace|kvlang' /tmp/ldd.txt
          ! readelf -d bin/byteseek | grep -E 'RPATH|RUNPATH'
      - name: 冒烟（移走系统库后 shm/fs + tutorial 子集）
        run: |
          set -euo pipefail
          rm -rf /tmp/single-ci && mkdir -p /tmp/single-ci
          # 证明单文件自包含：把 repo lib/ 整体移走（runtime/layout/前端/后端全在 payload）
          mv lib lib.hidden
          restore() { mv lib.hidden lib; }
          trap restore EXIT
          # 三种 DSN，且环境里只有 KVSPACE（绝对路径调用）
          for dsn in "shm:///tmp/single-ci/s" "fs:///tmp/single-ci/fs" \
                     "redis://127.0.0.1:6379"; do
            out=$(env -i KVSPACE="$dsn" "$PWD/bin/byteseek" -c 'print("ok")')
            echo "$dsn -> $out"
            [ "$out" = "ok" ]
          done
          env -i KVSPACE=fs:///tmp/single-ci/fs2 \
            "$PWD/bin/byteseek" tutorial/01-basics/hello.kv >/dev/null
          # tutorial 子集：TERM 用 single，layout 用 single 的 layout 子命令
          printf '#!/bin/sh\nexec env KVSPACE="$2" "$PWD/bin/byteseek" layout "$1"\n' \
            > /tmp/kl-wrap.sh
          chmod +x /tmp/kl-wrap.sh
          ln -sf "$PWD/bin/byteseek" /tmp/kvlang
          PATH="$PWD/bin:/tmp:$PATH" KVLANG_TERM_BIN="$PWD/bin/byteseek" \
          KVLANG_LAYOUT_BIN=/tmp/kl-wrap.sh KVSPACE=shm:///tmp/single-ci/tut \
            python3 tutorial/test.py --no-build --filter 01
