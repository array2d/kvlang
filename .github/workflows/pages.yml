name: pages

on:
  push:
    # 只在 master 发布；tag 不需要部署 Pages（tag 上 deploy job 会失败）。
    branches: [master]
    paths:
      - "site/**"
      - "stdlib/**"
      - "benchmark/results/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 版本号与日期从 tag 推导
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建站点
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
