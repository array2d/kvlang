name: ci-macos
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    name: build
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          cmake --version | head -1
          cargo --version
          clang --version | head -1
          python3 --version

      - name: Build all artifacts
        run: make artifact

      - name: runtimec ctest
        run: ctest --test-dir build/artifact-runtimec --output-on-failure
