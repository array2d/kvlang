name: ci-macos
on: [push, pull_request]
jobs:
  runtimec:
    runs-on: macos-latest
    name: runtimec
    steps:
      - uses: actions/checkout@v4
      - name: 取 kvspace 头（runtimec 只依赖 include/kvspace）
        run: |
          set -euo pipefail
          ver=$(python3 -c 'import json;print(json.load(open("deps.json"))["kvspace"])')
          echo "kvspace $ver"
          git clone --depth 1 --branch "$ver" \
            https://github.com/array2d/kvspace "$RUNNER_TEMP/kvspace"
          test -f "$RUNNER_TEMP/kvspace/include/kvspace/kvspace_xvalue.h"
      - name: 守卫：runtimec 不得依赖 runtimec2 / runtime
        run: |
          set -euo pipefail
          guard() {
            local rc=0
            grep -rn "$@" > /tmp/runtimec-guard.txt || rc=$?
            case $rc in
              0) echo "runtimec 引用了已删除的树："; cat /tmp/runtimec-guard.txt; return 1 ;;
              1) return 0 ;;
              *) echo "守卫执行失败 rc=$rc"; return 1 ;;
            esac
          }
          guard --include=*.c --include=*.h --include=*.txt --include=*.cmake \
            -E '(^|[/"<])(runtimec2|runtime)/' runtimec
          guard --include=CMakeLists.txt -E 'runtimec2|\.\./runtime/' runtimec
      - name: 配置与构建（Debug，-Werror）
        run: |
          set -euo pipefail
          cmake -S runtimec -B /tmp/kvlang-runtimec-build \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DKVSPACE_INCLUDE_DIRECTORY="$RUNNER_TEMP/kvspace/include"
          cmake --build /tmp/kvlang-runtimec-build --parallel
      - name: ctest
        run: ctest --test-dir /tmp/kvlang-runtimec-build --output-on-failure
      - name: 架构校验（三个结构脚本，各自非零退出即失败）
        run: |
          set -euo pipefail
          python3 runtimec/tools/architecture/check_layers.py \
            --source-root "$PWD"
          python3 runtimec/tools/architecture/check_names.py \
            --source-root "$PWD"
          python3 runtimec/tools/architecture/check_behavior_matrix.py \
            --source-root "$PWD"
      - name: 导出符号校验
        run: |
          set -euo pipefail
          python3 runtimec/tools/architecture/check_exports.py \
            --library /tmp/kvlang-runtimec-build/libkvlang_runtimec_scaffold.dylib \
            --manifest runtimec/interface/exports.txt
      - name: RWIR manifest 校验
        run: |
          set -euo pipefail
          if [ ! -f runtimec/tools/architecture/generate_rwir_catalog.py ]; then
            echo "::error::generate_rwir_catalog.py 未提交到本 commit（coding1 归属）"
            exit 1
          fi
          gcc --version | head -1
          python3 runtimec/tools/architecture/generate_rwir_catalog.py \
            --check --root "$PWD"

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建依赖链到 repo（blockmalloc / slotsboxmalloc / kvspace）
        run: |
          set -euo pipefail
          mkdir -p include lib/kvspace bin
          for repo in blockmalloc slotsboxmalloc kvspace; do
            git clone --depth 1 "https://github.com/array2d/$repo.git" "/tmp/$repo"
            cmake -S "/tmp/$repo" -B "/tmp/$repo/build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD" \
              -DCMAKE_PREFIX_PATH="$PWD" \
              -DCMAKE_INCLUDE_PATH="$PWD/include" \
              -DCMAKE_LIBRARY_PATH="$PWD/lib;$PWD/lib/kvspace" \
              -DCMAKE_C_FLAGS="-I$PWD/include" \
              -DCMAKE_CXX_FLAGS="-I$PWD/include" \
              -DCMAKE_EXE_LINKER_FLAGS="-L$PWD/lib -L$PWD/lib/kvspace" \
              -DCMAKE_SHARED_LINKER_FLAGS="-L$PWD/lib -L$PWD/lib/kvspace"
            cmake --build "/tmp/$repo/build" -j
            cmake --install "/tmp/$repo/build"
          done
          cp -P lib/kvspace/libkvspace*.dylib lib/ 2>/dev/null || true
      - name: 构建 layout（Rust）/ runtimec2 / byteseek
        run: |
          make layout      # → bin/kvlanglayout + lib/libkvlanglayout.dylib
          make runtimec2   # → lib/libkvlang_runtimec2.dylib
          make byteseek    # → bin/byteseek
