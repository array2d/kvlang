name: release-abi
on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry-run：构建 + 打包 + 自包含冒烟；填 tag 才发布
    inputs:
      tag:
        description: 发布目标 tag；留空则纯 dry-run（不发布任何资产）
        required: false
        default: ""
permissions:
  contents: write
env:
  # workflow_dispatch 在分支上跑，GITHUB_REF_NAME 含 /；用 tag 输入或固定名
  ABI_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || 'dryrun' }}
jobs:
  # Linux：deps.json 所列依赖有预编译 ABI tarball，直接下载安装后打包（自包含）。
  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ABI 依赖
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      - name: 构建 runtime + layout + byteseek（产 bin/ 下的 CLI）
        run: |
          make runtime
          make layout      # cargo build + cp kvlanglayout / libkvlanglayout.so → bin/
          make byteseek    # → bin/byteseek
      - name: 打包 ABI 产物
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-linux-x86_64"
          mkdir -p "$d/include/kvlang" "$d/lib/kvspace" "$d/bin"
          # 头（递归）：自己的 runtime 头 + deps.json 各依赖的头（/usr/include/<repo>/）
          cp -R runtime/include/. "$d/include/kvlang/"
          for h in kvspace blockmalloc slotsboxmalloc; do
            [ -d "/usr/include/$h" ] && cp -R "/usr/include/$h" "$d/include/"
          done
          # 库（递归扫）：本仓两个产物 + 依赖顶层库 + 后端库（dispatch 的 dlopen 目录）
          find bin layout/target/release -maxdepth 1 \( -name 'lib*.so*' -o -name 'lib*.dylib' \) -exec cp -P {} "$d/lib/" \;
          # dispatch 前端：runtime/layout 的 DT_NEEDED 是 libkvspace.so.1，
          # 连同 soname 链一起收进顶层 lib/（cp -P 保留符号链接）
          cp -P /usr/lib/libkvspace.so* "$d/lib/"
          # blockmalloc / slotsboxmalloc 是 header-only（只发头、无 lib），故不收集它们的 .so
          find /usr/lib/kvspace -maxdepth 1 -name '*.so*' -exec cp -P {} "$d/lib/kvspace/" \;
          # 可执行：本仓 CLI + 依赖带来的 CLI
          cp bin/byteseek bin/kvlanglayout "$d/bin/"
          cp /usr/bin/kvspace "$d/bin/"
          printf '{"abi":"%s"}\n' "$v" > "$d/abi-manifest.json"
          tar czf "$d.tar.gz" "$d"
          tar tzf "$d.tar.gz"
          sha256sum "$d.tar.gz" | tee SHA256SUMS-linux
      - name: 自包含冒烟（空目录解包，隐藏系统安装）
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-linux-x86_64"
          # 前端与后端都必须随包走
          test -e "$d/lib/libkvspace.so.1"
          test -n "$(ls -A "$d/lib/kvspace")"
          tmp=$(mktemp -d)
          tar xzf "$d.tar.gz" -C "$tmp"
          # 暂时移走系统安装，证明运行期只依赖 tarball 内容
          sudo mv /usr/lib/kvspace /usr/lib/kvspace.hidden
          for f in /usr/lib/libkvspace.so*; do
            sudo mv "$f" "/tmp/$(basename "$f").hidden"
          done
          restore() {
            sudo mv /usr/lib/kvspace.hidden /usr/lib/kvspace
            for f in /tmp/libkvspace.so*.hidden; do
              sudo mv "$f" "/usr/lib/$(basename "$f" .hidden)"
            done
          }
          trap restore EXIT
          # 不设 LD_LIBRARY_PATH：必须靠 ELF RPATH（bin/byteseek 带 $ORIGIN/../lib）
          # 解出前端；后端目录仍是构建期常量 /usr/lib/kvspace，故显式给
          # KVSPACE_BACKEND_PATH（frontend 支持的运行期覆盖）。
          out=$(env -i PATH=/usr/bin:/bin HOME="$tmp" \
            KVSPACE="shm://$tmp/shm" \
            KVSPACE_BACKEND_PATH="$tmp/$d/lib/kvspace" \
            "$tmp/$d/bin/byteseek" -c 'print("ok")')
          echo "smoke: $out"
          [ "$out" = "ok" ]
          # kvlanglayout 同样必须靠相对 RPATH 从包内解析前端
          usage=$("$tmp/$d/bin/kvlanglayout" 2>&1 || true)
          echo "smoke layout: $usage"
          echo "$usage" | grep -q '^usage: kvlanglayout'
      - name: 发布 release
        if: github.event_name == 'push'
        run: gh release create "${GITHUB_REF_NAME}" kvlang-abi-*-linux-*.tar.gz SHA256SUMS-linux --generate-notes

  # macOS：各仓只有 linux ABI tarball，依赖全部源码构建（装 /usr/local）后打包（自包含）。
  macos:
    needs: linux
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KVSPACE_LIB_DIR: /usr/local/lib/kvspace # /usr 受 SIP 保护
    steps:
      - uses: actions/checkout@v4
      - name: 构建依赖链（blockmalloc / slotsboxmalloc / kvspace / kvspace-c / kvspace-durable）
        run: |
          set -euo pipefail
          PREFIX=/usr/local
          for repo in blockmalloc slotsboxmalloc kvspace kvspace-c; do
            git clone --depth 1 "https://github.com/array2d/$repo.git" "/tmp/$repo"
            cmake -S "/tmp/$repo" -B "/tmp/$repo/build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX
            cmake --build "/tmp/$repo/build" -j
            sudo cmake --install "/tmp/$repo/build"
          done
          git clone --depth 1 https://github.com/array2d/kvspace-durable.git /tmp/kvspace-durable
          cargo build --release --manifest-path /tmp/kvspace-durable/Cargo.toml
          # durable 为 Rust（无 install 规则），手动装入后端目录，供 frontend dlopen
          sudo mkdir -p "$PREFIX/lib/kvspace"
          sudo cp /tmp/kvspace-durable/target/release/libkvspace_durable.dylib "$PREFIX/lib/kvspace/"
      - name: 构建 runtime + layout + byteseek + kvspace CLI
        run: |
          cmake -S runtime -B build/runtime -DCMAKE_BUILD_TYPE=Release -DKVSPACE_LIB_DIR="$KVSPACE_LIB_DIR"
          cmake --build build/runtime --target kvlang_runtime -j
          cargo build --release --manifest-path layout/Cargo.toml
          # byteseek 的 build.rs 在 ../bin 找 libkvlang_runtime/libkvlanglayout，必须先就位
          mkdir -p bin
          cp layout/target/release/libkvlanglayout.dylib bin/
          cargo build --release --manifest-path byteseek/Cargo.toml
          # kvspace CLI 用 #[link(name = "kvspace")]，前端装在 /usr/local/lib/kvspace
          RUSTFLAGS="-L native=/usr/local/lib/kvspace" cargo build --release --manifest-path /tmp/kvspace/cli/Cargo.toml
          cp layout/target/release/kvlanglayout bin/
          cp byteseek/target/release/byteseek bin/
      - name: 后端装载冒烟（frontend 的 dlopen 真能加载后端）
        run: |
          cat > /tmp/conn.c <<'EOF'
          #include <kvspace/kvspace.h>
          #include <stdio.h>
          int main(void) {
              void *shm = kvspaceConnect("shm:///tmp/ks_rel_macos");
              void *fs  = kvspaceConnect("fs:///tmp/ks_rel_fs");
              printf("shm=%p fs=%p\n", shm, fs);
              if (shm) kvspaceClose(shm);
              if (fs)  kvspaceClose(fs);
              return (shm && fs) ? 0 : 1;
          }
          EOF
          cc /tmp/conn.c -o /tmp/conn -I/usr/local/include -L/usr/local/lib/kvspace -lkvspace
          # libkvspace 在 /usr/local/lib/kvspace；后端依赖 libblockmalloc 在 /usr/local/lib
          DYLD_FALLBACK_LIBRARY_PATH=/usr/local/lib:/usr/local/lib/kvspace /tmp/conn
      - name: 打包 ABI 产物
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-darwin-arm64"
          mkdir -p "$d/include/kvlang" "$d/lib/kvspace" "$d/bin"
          # 头（递归）：自己的 runtime 头 + 各依赖的头（/usr/local/include/<repo>/）
          cp -R runtime/include/. "$d/include/kvlang/"
          for h in kvspace blockmalloc slotsboxmalloc; do
            [ -d "/usr/local/include/$h" ] && cp -R "/usr/local/include/$h" "$d/include/"
          done
          # 库（递归扫）：本仓产物 + 依赖顶层 dylib + 后端 dylib（dispatch 的 dlopen 目录）
          find bin layout/target/release -maxdepth 1 -name '*.dylib' -exec cp -P {} "$d/lib/" \;
          # dispatch 前端：runtime/layout/CLI 都以 @rpath 依赖 libkvspace.1.dylib
          cp -P /usr/local/lib/kvspace/libkvspace*.dylib "$d/lib/"
          find /usr/local/lib/kvspace -maxdepth 1 -name '*.dylib' -exec cp -P {} "$d/lib/kvspace/" \;
          cp /tmp/kvspace-durable/target/release/libkvspace_durable.dylib "$d/lib/kvspace/"
          # 可执行：本仓 CLI + 依赖带来的 CLI
          cp bin/byteseek bin/kvlanglayout "$d/bin/"
          cp /tmp/kvspace/cli/target/release/kvspace "$d/bin/"
          # 抹掉构建机绝对路径：layout 的 ID 与 CLI 对它的依赖必须是 @rpath，
          # 且 bin/ 与 lib/ 都要能从 tarball 内的 lib/ 解析 @rpath
          has_rpath() { otool -l "$1" | awk '/cmd LC_RPATH/{f=1} f && /path /{print $2; f=0}' | grep -qx "$2"; }
          add_rpath() {
            has_rpath "$1" "$2" && return 0
            install_name_tool -add_rpath "$2" "$1"
          }
          cur_id=$(otool -D "$d/lib/libkvlanglayout.dylib" | tail -n +2)
          [ "$cur_id" = "@rpath/libkvlanglayout.dylib" ] || \
            install_name_tool -id @rpath/libkvlanglayout.dylib "$d/lib/libkvlanglayout.dylib"
          layout_dep=$(otool -L "$d/bin/byteseek" | awk '/libkvlanglayout\.dylib/ {print $1; exit}')
          test -n "$layout_dep"
          case "$layout_dep" in
            @rpath/*) ;;
            *) install_name_tool -change "$layout_dep" @rpath/libkvlanglayout.dylib "$d/bin/byteseek" ;;
          esac
          # 前端依赖必须是 @rpath，绝对路径加 rpath 也救不回来
          front_dep=$(otool -L "$d/bin/byteseek" | awk '/libkvspace\.[0-9]+\.dylib/ {print $1; exit}')
          test -n "$front_dep"
          case "$front_dep" in
            @rpath/*) ;;
            *) install_name_tool -change "$front_dep" @rpath/libkvspace.1.dylib "$d/bin/byteseek" ;;
          esac
          for f in "$d"/bin/* "$d"/lib/*.dylib; do
            add_rpath "$f" @loader_path/../lib
          done
          # 打包前核验：CLI 的 layout/前端依赖确实解析到 @rpath，且 rpath 覆盖 lib/
          otool -L "$d/bin/byteseek"
          otool -l "$d/bin/byteseek" | awk '/cmd LC_RPATH/{f=1} f && /path /{print "rpath:", $2; f=0}'
          for f in "$d/bin/kvlanglayout" "$d/lib/libkvlang_runtime.dylib" \
                   "$d/lib/libkvlanglayout.dylib" "$d/lib/libkvspace.1.dylib"; do
            echo "=== otool -L $f"
            otool -L "$f"
          done
          printf '{"abi":"%s"}\n' "$v" > "$d/abi-manifest.json"
          tar czf "$d.tar.gz" "$d"
          tar tzf "$d.tar.gz"
          sha256sum "$d.tar.gz" | tee SHA256SUMS-macos
      - name: 上传 dry-run 产物（供合并前核对/重传）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kvlang-abi-${{ env.ABI_VERSION }}-darwin-arm64
          path: |
            kvlang-abi-${{ env.ABI_VERSION }}-darwin-arm64.tar.gz
            SHA256SUMS-macos
      - name: 自包含冒烟（空目录解包，隐藏系统安装）
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-darwin-arm64"
          test -e "$d/lib/libkvspace.1.dylib"
          tmp=$(mktemp -d)
          tar xzf "$d.tar.gz" -C "$tmp"
          sudo mv /usr/local/lib/kvspace /usr/local/lib/kvspace.hidden
          restore() { sudo mv /usr/local/lib/kvspace.hidden /usr/local/lib/kvspace; }
          trap restore EXIT
          # 不设 DYLD_LIBRARY_PATH：必须靠 LC_RPATH（@loader_path/../lib）解析 @rpath；
          # 后端目录仍是构建期常量，故只显式给 KVSPACE_BACKEND_PATH。
          out=$(env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$tmp" \
            KVSPACE="shm://$tmp/shm" \
            KVSPACE_BACKEND_PATH="$tmp/$d/lib/kvspace" \
            "$tmp/$d/bin/byteseek" -c 'print("ok")')
          echo "smoke: $out"
          [ "$out" = "ok" ]
          # kvlanglayout 同样必须靠 @loader_path/../lib 从包内解析 @rpath
          usage=$("$tmp/$d/bin/kvlanglayout" 2>&1 || true)
          echo "smoke layout: $usage"
          echo "$usage" | grep -q '^usage: kvlanglayout'
      - name: dispatch 发布（tag 输入非空且冒烟通过）
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          gh release upload "${{ inputs.tag }}" \
            "kvlang-abi-${{ inputs.tag }}-darwin-arm64.tar.gz" \
            SHA256SUMS-macos --clobber
      - name: 上传到 release
        if: github.event_name == 'push'
        run: gh release upload "${GITHUB_REF_NAME}" kvlang-abi-*-darwin-*.tar.gz SHA256SUMS-macos --clobber
