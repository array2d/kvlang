name: release-abi
on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry-run：构建 + 打包 + 自包含冒烟；填 tag 才发布
    inputs:
      tag:
        description: 发布目标 tag；留空则纯 dry-run（不发布任何资产）
        required: false
        default: ""
permissions:
  contents: write
env:
  # workflow_dispatch 在分支上跑，GITHUB_REF_NAME 含 /；用 tag 输入或固定名
  ABI_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || 'dryrun' }}
jobs:
  # 产物布局（repo 即 prefix）：bin/ 可执行、lib/ 库、lib/kvspace/ 后端、
  # include/ 头。tarball 保持同一布局，rpath 相对 $ORIGIN / @loader_path。
  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ABI 依赖到 repo（include/lib/lib/kvspace/bin）
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      - name: 构建 runtime + layout + byteseek
        run: |
          make runtimec2    # CMake 直写 lib/
          make layout       # → bin/kvlanglayout + lib/libkvlanglayout.so
          make byteseek     # → bin/byteseek
      - name: 打包 ABI 产物
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-linux-x86_64"
          mkdir -p "$d/include/kvlang" "$d/lib/kvspace" "$d/bin"
          cp -R runtime/include/. "$d/include/kvlang/"
          for h in kvspace blockmalloc slotsboxmalloc; do
            [ -d "include/$h" ] && cp -R "include/$h" "$d/include/"
          done
          find lib -maxdepth 1 \( -name 'lib*.so*' -o -name 'lib*.dylib' \) -exec cp -P {} "$d/lib/" \;
          find lib/kvspace -maxdepth 1 -name '*.so*' -exec cp -P {} "$d/lib/kvspace/" \;
          cp bin/byteseek bin/kvlanglayout bin/kvspace "$d/bin/"
          printf '{"abi":"%s"}\n' "$v" > "$d/abi-manifest.json"
          tar czf "$d.tar.gz" "$d"
          tar tzf "$d.tar.gz"
          sha256sum "$d.tar.gz" | tee SHA256SUMS-linux
      - name: 自包含冒烟（解包到临时目录运行，不依赖 /usr）
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-linux-x86_64"
          run="$RUNNER_TEMP/rel-smoke"
          rm -rf "$run"; mkdir -p "$run"
          tar xzf "$d.tar.gz" -C "$run" --strip-components=1
          out=$(env -i PATH=/usr/bin:/bin HOME=/tmp \
            KVSPACE="shm://$run/smoke.shm" "$run/bin/byteseek" -c 'print("ok")')
          echo "smoke: $out"
          [ "$out" = "ok" ]
          # stdlib 自举 + layout 冒烟（同一 tarball 布局）
          env -i PATH=/usr/bin:/bin HOME=/tmp \
            KVSPACE="shm://$run/boot.shm" "$run/bin/byteseek" -c 'print("boot")' >/dev/null
          env -i PATH=/usr/bin:/bin HOME=/tmp \
            KVSPACE="shm://$run/layout.shm" "$run/bin/byteseek" -c 'print("boot")' >/dev/null
          env -i PATH=/usr/bin:/bin HOME=/tmp \
            KVSPACE="shm://$run/layout.shm" \
            "$run/bin/kvlanglayout" tutorial/01-basics/hello.kv "shm://$run/layout.shm" >/dev/null
          usage=$("$run/bin/kvlanglayout" 2>&1 || true)
          echo "smoke layout: $usage"
          echo "$usage" | grep -q '^usage: kvlanglayout'
          "$run/bin/kvspace" get /nonexistent >/dev/null 2>&1 || true
      - name: 构建单一二进制（#493：嵌入本 tag 构建的 runtime/layout + 依赖）
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          grep -aq "kvspace:embed-noload" lib/libkvspace.so.1
          FRONTEND_SO=lib/libkvspace.so.1 make single
          python3 -c 'import json,hashlib,sys; v=sys.argv[1]; deps=json.load(open("deps.json")); b=open("bin/byteseek","rb").read(); json.dump({"single":v,"platform":"linux-x86_64","embedded":deps,"size":len(b),"sha256":hashlib.sha256(b).hexdigest()}, open("kvlang-single-%s-linux-x86_64.json"%v,"w"), indent=2)' "$v"
          cp bin/byteseek "kvlang-single-$v-linux-x86_64"
          sha256sum "kvlang-single-$v-linux-x86_64" | tee SHA256SUMS-single
      - name: 单文件冒烟（无系统库、无 rpath）
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          ldd "kvlang-single-$v-linux-x86_64" > /tmp/ldd-single.txt
          ! grep -E 'kvspace|kvlang' /tmp/ldd-single.txt
          ! readelf -d "kvlang-single-$v-linux-x86_64" | grep -E 'RPATH|RUNPATH'
          out=$(env -i PATH=/usr/bin:/bin HOME=/tmp \
            KVSPACE="shm:///tmp/single-rel.shm" \
            "./kvlang-single-$v-linux-x86_64" -c 'print("ok")')
          [ "$out" = "ok" ]
      - name: 发布 release
        if: github.event_name == 'push'
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            kvlang-abi-*-linux-*.tar.gz SHA256SUMS-linux \
            kvlang-single-*-linux-x86_64 kvlang-single-*.json SHA256SUMS-single \
            --generate-notes

  # macOS：依赖全部源码构建进 repo（include/、lib/、lib/kvspace/、bin/），
  # 与 Linux 同一 tarball 布局；不使用 /usr/local。
  macos:
    needs: linux
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 构建依赖链到 repo（blockmalloc / slotsboxmalloc / kvspace / kvspace-c / durable）
        run: |
          set -euo pipefail
          mkdir -p include lib/kvspace bin
          for repo in blockmalloc slotsboxmalloc kvspace kvspace-c; do
            git clone --depth 1 "https://github.com/array2d/$repo.git" "/tmp/$repo"
            cmake -S "/tmp/$repo" -B "/tmp/$repo/build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD" \
              -DCMAKE_PREFIX_PATH="$PWD" \
              -DCMAKE_INCLUDE_PATH="$PWD/include" \
              -DCMAKE_LIBRARY_PATH="$PWD/lib;$PWD/lib/kvspace"
            cmake --build "/tmp/$repo/build" -j
            cmake --install "/tmp/$repo/build"
          done
          # kvspace 前端按安装规则落在 lib/kvspace/，顶层 lib/ 也放一份
          # （runtime/layout/byteseek 以 -lkvspace 链接，dlopen 也按 SONAME 找）。
          cp -P lib/kvspace/libkvspace*.dylib lib/ 2>/dev/null || true
          git clone --depth 1 https://github.com/array2d/kvspace-durable.git /tmp/kvspace-durable
          cargo build --release --manifest-path /tmp/kvspace-durable/Cargo.toml
          cp /tmp/kvspace-durable/target/release/libkvspace_durable.dylib lib/kvspace/
      - name: 构建 runtime + layout + byteseek + kvspace CLI
        run: |
          set -euo pipefail
          make runtimec2
          make layout
          make byteseek
          RUSTFLAGS="-L native=$PWD/lib -C link-arg=-Wl,-rpath,@loader_path/../lib" \
            cargo build --release --manifest-path /tmp/kvspace/cli/Cargo.toml
          cp /tmp/kvspace/cli/target/release/kvspace bin/
      - name: 后端装载冒烟（repo 内前端 dlopen 后端）
        run: |
          cat > /tmp/conn.c <<'EOF'
          #include <kvspace/kvspace.h>
          #include <stdio.h>
          int main(void) {
              void *shm = kvspaceConnect("shm:///tmp/ks_rel_macos");
              void *fs  = kvspaceConnect("fs:///tmp/ks_rel_fs");
              printf("shm=%p fs=%p\n", shm, fs);
              if (shm) kvspaceClose(shm);
              if (fs)  kvspaceClose(fs);
              return (shm && fs) ? 0 : 1;
          }
          EOF
          cc /tmp/conn.c -o /tmp/conn -I"$PWD/include" -L"$PWD/lib/kvspace" -lkvspace
          DYLD_FALLBACK_LIBRARY_PATH="$PWD/lib:$PWD/lib/kvspace" /tmp/conn
      - name: 打包 ABI 产物
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-darwin-arm64"
          mkdir -p "$d/include/kvlang" "$d/lib/kvspace" "$d/bin"
          cp -R runtime/include/. "$d/include/kvlang/"
          for h in kvspace blockmalloc slotsboxmalloc; do
            [ -d "include/$h" ] && cp -R "include/$h" "$d/include/"
          done
          find lib -maxdepth 1 -name '*.dylib' -exec cp -P {} "$d/lib/" \;
          find lib/kvspace -maxdepth 1 -name '*.dylib' -exec cp -P {} "$d/lib/kvspace/" \;
          cp bin/byteseek bin/kvlanglayout bin/kvspace "$d/bin/"
          # 抹掉构建机绝对路径：layout 的 ID 与 CLI/byteseek 的依赖落到 @rpath，
          # bin/ 与 lib/ 都能从 tarball 内 lib/ 解析。
          has_rpath() { otool -l "$1" | awk '/cmd LC_RPATH/{f=1} f && /path /{print $2; f=0}' | grep -qx "$2"; }
          add_rpath() {
            has_rpath "$1" "$2" && return 0
            install_name_tool -add_rpath "$2" "$1"
          }
          cur_id=$(otool -D "$d/lib/libkvlanglayout.dylib" | tail -n +2)
          [ "$cur_id" = "@rpath/libkvlanglayout.dylib" ] || \
            install_name_tool -id @rpath/libkvlanglayout.dylib "$d/lib/libkvlanglayout.dylib"
          layout_dep=$(otool -L "$d/bin/byteseek" | awk '/libkvlanglayout\.dylib/ {print $1; exit}')
          test -n "$layout_dep"
          case "$layout_dep" in
            @rpath/*) ;;
            *) install_name_tool -change "$layout_dep" @rpath/libkvlanglayout.dylib "$d/bin/byteseek" ;;
          esac
          front_dep=$(otool -L "$d/bin/byteseek" | awk '/libkvspace\.[0-9]+\.dylib/ {print $1; exit}')
          test -n "$front_dep"
          case "$front_dep" in
            @rpath/*) ;;
            *) install_name_tool -change "$front_dep" @rpath/libkvspace.1.dylib "$d/bin/byteseek" ;;
          esac
          for f in "$d"/bin/* "$d"/lib/*.dylib; do
            add_rpath "$f" @loader_path/../lib
          done
          otool -L "$d/bin/byteseek"
          otool -l "$d/bin/byteseek" | awk '/cmd LC_RPATH/{f=1} f && /path /{print "rpath:", $2; f=0}'
          printf '{"abi":"%s"}\n' "$v" > "$d/abi-manifest.json"
          tar czf "$d.tar.gz" "$d"
          tar tzf "$d.tar.gz"
          sha256sum "$d.tar.gz" | tee SHA256SUMS-macos
      - name: 自包含冒烟（解包到临时目录运行）
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-darwin-arm64"
          test -e "$d/lib/libkvspace.1.dylib"
          run="$RUNNER_TEMP/rel-smoke"
          rm -rf "$run"; mkdir -p "$run"
          tar xzf "$d.tar.gz" -C "$run" --strip-components=1
          out=$(env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/tmp \
            KVSPACE="shm://$run/smoke.shm" "$run/bin/byteseek" -c 'print("ok")')
          echo "smoke: $out"
          [ "$out" = "ok" ]
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/tmp \
            KVSPACE="shm://$run/layout.shm" "$run/bin/byteseek" -c 'print("boot")' >/dev/null
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/tmp \
            KVSPACE="shm://$run/layout.shm" \
            "$run/bin/kvlanglayout" tutorial/01-basics/hello.kv "shm://$run/layout.shm" >/dev/null
      - name: 上传 dry-run 产物（供合并前核对/重传）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kvlang-abi-${{ env.ABI_VERSION }}-darwin-arm64
          path: |
            kvlang-abi-${{ env.ABI_VERSION }}-darwin-arm64.tar.gz
            SHA256SUMS-macos
      - name: dispatch 发布（tag 输入非空且冒烟通过）
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          gh release upload "${{ inputs.tag }}" \
            "kvlang-abi-${{ inputs.tag }}-darwin-arm64.tar.gz" \
            SHA256SUMS-macos --clobber
      - name: 上传到 release
        if: github.event_name == 'push'
        run: gh release upload "${GITHUB_REF_NAME}" kvlang-abi-*-darwin-*.tar.gz SHA256SUMS-macos --clobber
