name: release-abi
on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry-run：构建 + 打包 + 自包含冒烟；填 tag 才发布
    inputs:
      tag:
        description: 发布目标 tag；留空则纯 dry-run（不发布任何资产）
        required: false
        default: ""
permissions:
  contents: write
env:
  # workflow_dispatch 在分支上跑，GITHUB_REF_NAME 含 /；用 tag 输入或固定名
  ABI_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || 'dryrun' }}
jobs:
  # 产物布局（repo 即 prefix）：bin/ 可执行、lib/ 库、lib/kvspace/ 后端、
  # include/ 头。tarball 保持同一布局，rpath 相对 $ORIGIN / @loader_path。
  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ABI 依赖到 repo（include/lib/lib/kvspace/bin）
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: ./ci/deps.sh
      # `ci/deps.sh` 只解发布包、不留源码，而 `make kvspace-cli` 需要 kvspace 仓的
      # `cli/`（独立 Cargo 项目）。所以这里按 deps.json 的 pin 克隆一份到
      # $RUNNER_TEMP——**不用 /tmp**，那目录在 runner 上不保证活到后续 step。
      - name: 克隆 kvspace 源码（构建 CLI 用，按 deps.json 的 pin）
        run: |
          set -euo pipefail
          ver=$(python3 -c 'import json;print(json.load(open("deps.json"))["kvspace"])')
          echo "kvspace pin: $ver"
          git clone --depth 1 --branch "$ver" \
            https://github.com/array2d/kvspace.git "$RUNNER_TEMP/kvspace"
      # 只构建活跃组件。runtimec2 与旧 C runtime 已归档到 oldhero/oldgo/（e927a923）
      # 并冻结在旧 kvspace ABI 上——它们的源码连 `kvspace/kvspace.h` 都找不到，
      # 在这里调 `make runtimec2` 会让 release 在第一步就死掉。
      #
      # byteseek 暂不发：缺 kvlangDefRwir / kvlangRuntime* / kvlangRwirext* 十二个 ABI
      # （TASK-035），修复后恢复。它的 Makefile target 保留，不要删。
      - name: 构建 layout + runtimec 运行库
        run: |
          # 三个 target 都（直接或经 kvlang-xvalue 间接触发）需要 kvspace 的源码路径：
          # 兄弟仓不是默认值（G11），不传就 $(error)。
          make layout KVSPACE_SRC="$RUNNER_TEMP/kvspace"       # → bin/kvlanglayout + lib/libkvlanglayout.so
          make runtimec-lib KVSPACE_SRC="$RUNNER_TEMP/kvspace" # → lib/libkvlang_runtime.so（自带陈旧 .so 闸）
          # kvspace CLI 走 Makefile 的 target，不自己写 cargo 命令——那个 target 里
          # 带着正确的 rpath 与链接参数，另写一份就是第二个真相。
          make kvspace-cli KVSPACE_SRC="$RUNNER_TEMP/kvspace"
      - name: 陈旧 .so 闸（打包前兜底）
        run: |
          set -euo pipefail
          # `lib/` 是 gitignore 的持久目录，上一次构建的残留会被 `find` 收进发布包。
          # 已实测：`lib/libkvlang_runtimec_scaffold.so`（改名前的内部 target 产物）
          # 至今仍引用 kvspaceXvalueHeadNewPtr/Slack，被打进包里就是发布一个坏库。
          # 逐个文件过 Makefile 里同一道闸，不另写一份判断逻辑。
          make stale-gate
      - name: 打包 ABI 产物
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-linux-x86_64"
          mkdir -p "$d/include/kvlang" "$d/lib/kvspace" "$d/bin"
          # kvlang 头有两个来源，`runtime/include/` 已随 c2 归档消失（e927a923）：
          #   include/kvlang/        —— 语言层（xvalue.h 构造器、const.h）
          #   runtimec/include/kvlang/ —— 运行时 ABI（runtimec.h）
          cp -R include/kvlang/. "$d/include/kvlang/"
          cp -R runtimec/include/kvlang/. "$d/include/kvlang/"
          for h in kvspace blockmalloc slotsboxmalloc; do
            [ -d "include/$h" ] && cp -R "include/$h" "$d/include/"
          done
          # 只收**当前构建会产出**的库名，不 `find` 全收——`find` 的开放性是残留
          # 混进发布包的通道（见上一步的 scaffold .so）。
          for so in libkvlang_runtime libkvlanglayout libkvspace; do
            for f in "lib/$so".so*; do
              [ -e "$f" ] && cp -P "$f" "$d/lib/"
            done
          done
          find lib/kvspace -maxdepth 1 -name '*.so*' -exec cp -P {} "$d/lib/kvspace/" \;
          # 断言：恰好 3 个库名（允许 soname 链接），多一个就是残留。
          names=$(find "$d/lib" -maxdepth 1 -type f -name '*.so*' | sed 's/.*\///;s/\.so.*//' | sort -u)
          test "$names" = "$(printf 'libkvlang_runtime\nlibkvlanglayout\nlibkvspace')" || {
            echo "发布包 lib/ 出现非预期库："; ls "$d/lib"; exit 1; }
          # byteseek 暂不发（TASK-035），bin/ 只有这两个。
          cp bin/kvlanglayout bin/kvspace "$d/bin/"
          test "$(ls "$d/bin" | sort | tr '\n' ' ')" = "kvlanglayout kvspace " || {
            echo "发布包 bin/ 出现非预期可执行："; ls "$d/bin"; exit 1; }
          printf '{"abi":"%s"}\n' "$v" > "$d/abi-manifest.json"
          tar czf "$d.tar.gz" "$d"
          tar tzf "$d.tar.gz"
          sha256sum "$d.tar.gz" | tee SHA256SUMS-linux
      - name: 自包含冒烟（解包到临时目录运行，不依赖 /usr）
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-linux-x86_64"
          run="$RUNNER_TEMP/rel-smoke"
          rm -rf "$run"; mkdir -p "$run"
          tar xzf "$d.tar.gz" -C "$run" --strip-components=1
          # byteseek 暂不发（TASK-035），所以**不能**用「layout 一个 tutorial 文件」当冒烟：
          # 那些文件调 println 等 stdlib 函数，而 stdlib 原本靠 byteseek 布进同一个
          # shm。byteseek 摘掉后那条路的前提就没了（实测报「未定义函数 println」）。
          # 改为验包内三个产物各自**自证可用**：
          #   1. kvlanglayout vet  —— 不需 stdlib，验 parse+lower 链路
          #   2. kvspace 写读往返   —— 验 libkvspace 与 CLI 在同包里能对上
          #   3. 两个可执行都无系统依赖泄漏（ldd 只应看到包内库与 libc）
          "$run/bin/kvlanglayout" vet "$GITHUB_WORKSPACE/tutorial/runtimec/01-basics/hello.kv" >/dev/null
          usage=$("$run/bin/kvlanglayout" 2>&1 || true)
          echo "smoke layout: $usage"
          echo "$usage" | grep -q '^usage: kvlanglayout'
          env -i PATH=/usr/bin:/bin HOME=/tmp KVSPACE="shm://$run/rt.shm" \
            "$run/bin/kvspace" mkindex /t/
          # 断言四个字段，不是「命令没报错」——**没报错不等于值对**。
          # 新建的空索引：body 与 attr 都应为 0，总长 = 16 字节 head，padding 全零。
          head_out=$(env -i PATH=/usr/bin:/bin HOME=/tmp KVSPACE="shm://$run/rt.shm" \
            "$run/bin/kvspace" head /t/)
          echo "smoke kvspace head: $head_out"
          echo "$head_out" | grep -q 'bodylen=0'   || { echo "期望 bodylen=0"; exit 1; }
          echo "$head_out" | grep -q 'attrslen=0'  || { echo "期望 attrslen=0"; exit 1; }
          echo "$head_out" | grep -q 'total=16'    || { echo "期望 total=16"; exit 1; }
          echo "$head_out" | grep -q 'padding=zero' || { echo "期望 padding=zero"; exit 1; }
          echo "smoke kvspace: ok"
          leaked=$(env -i PATH=/usr/bin:/bin HOME=/tmp \
            ldd "$run/bin/kvlanglayout" "$run/bin/kvspace" | grep -E 'kvlang|kvspace' | grep -v "$run" || true)
          test -z "$leaked" || { echo "可执行依赖了包外的 kvlang/kvspace 库："; echo "$leaked"; exit 1; }
      # 单一二进制（#493）**已停用**，此处不再构建：
      #   `make single` 是硬失败桩（Makefile:59），embed 源 runtimec2 已归档且
      #   runtimec 尚无 kvlangDefRwir 等价 ABI（TASK-035）。等 TASK-035 落地后
      #   连同这两步一起恢复。
      - name: 发布 release
        if: github.event_name == 'push'
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            kvlang-abi-*-linux-*.tar.gz SHA256SUMS-linux \
            --generate-notes

  # macOS：依赖全部源码构建进 repo（include/、lib/、lib/kvspace/、bin/），
  # 与 Linux 同一 tarball 布局；不使用 /usr/local。
  macos:
    needs: linux
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # kvspace-c 已冻结并入 kvspace（shm 引擎在本仓），不再作为依赖构建。
      - name: 构建依赖链到 repo（blockmalloc / slotsboxmalloc / kvspace）
        run: |
          set -euo pipefail
          mkdir -p include lib/kvspace bin
          for repo in blockmalloc slotsboxmalloc kvspace; do
            # 用 $RUNNER_TEMP 而不是 /tmp：后者在 runner 上不保证活到后续 step。
            git clone --depth 1 "https://github.com/array2d/$repo.git" "$RUNNER_TEMP/$repo"
            cmake -S "$RUNNER_TEMP/$repo" -B "$RUNNER_TEMP/$repo/build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD" \
              -DCMAKE_PREFIX_PATH="$PWD" \
              -DCMAKE_INCLUDE_PATH="$PWD/include" \
              -DCMAKE_LIBRARY_PATH="$PWD/lib;$PWD/lib/kvspace" \
              -DCMAKE_C_FLAGS="-I$PWD/include" \
              -DCMAKE_CXX_FLAGS="-I$PWD/include" \
              -DCMAKE_EXE_LINKER_FLAGS="-L$PWD/lib -L$PWD/lib/kvspace" \
              -DCMAKE_SHARED_LINKER_FLAGS="-L$PWD/lib -L$PWD/lib/kvspace"
            cmake --build "$RUNNER_TEMP/$repo/build" -j
            cmake --install "$RUNNER_TEMP/$repo/build"
          done
          # kvspace 前端按安装规则落在 lib/kvspace/，顶层 lib/ 也放一份
          # （runtime/layout/byteseek 以 -lkvspace 链接，dlopen 也按 SONAME 找）。
          cp -P lib/kvspace/libkvspace*.dylib lib/ 2>/dev/null || true
          git clone --depth 1 https://github.com/array2d/kvspace-durable.git "$RUNNER_TEMP/kvspace-durable"
          cargo build --release --manifest-path "$RUNNER_TEMP/kvspace-durable/Cargo.toml"
          cp "$RUNNER_TEMP/kvspace-durable/target/release/libkvspace_durable.dylib" lib/kvspace/
      # byteseek 暂不发：缺 kvlangDefRwir / kvlangRuntime* / kvlangRwirext* 十二个 ABI
      # （TASK-035），修复后恢复。它的 Makefile target 保留，不要删。
      - name: 构建 layout + runtimec 运行库 + kvspace CLI
        run: |
          set -euo pipefail
          # 同 Linux job：三个 target 都需要 kvspace 源码路径（G11 兄弟仓不是默认值）。
          make layout KVSPACE_SRC="$RUNNER_TEMP/kvspace"
          make runtimec-lib KVSPACE_SRC="$RUNNER_TEMP/kvspace"
          # 走 Makefile 的 target，不自己写 cargo 命令——target 里带着正确的链接参数
          # 与 rpath，另写一份就是第二个真相。
          make kvspace-cli KVSPACE_SRC="$RUNNER_TEMP/kvspace"
      - name: 陈旧 .so 闸（打包前兜底）
        run: |
          set -euo pipefail
          # 同 linux job：`lib/` 是持久目录，残留会被 `find` 收进发布包。
          # `stale-gate` 目标同时扫 *.so* 与 *.dylib，两个平台共用一份判据。
          make stale-gate
      - name: 后端装载冒烟（repo 内前端连 shm）
        run: |
          # 单库化后 `libkvspace` 只服务 `shm://`（没有运行期 dispatch、不 dlopen），
          # 其它 scheme 一律返回 NULL。所以这里只验 shm 能连上——原先那条
          # 「同时要求 fs:// 也成功」的断言在单库模型下永远不成立。
          cat > "$RUNNER_TEMP/conn.c" <<'EOF'
          #include <kvspace/kvspace.h>
          #include <stdio.h>
          int main(void) {
              void *shm = kvspaceConnect("shm:///tmp/ks_rel_macos");
              printf("shm=%p\n", shm);
              if (shm) kvspaceClose(shm);
              return shm ? 0 : 1;
          }
          EOF
          cc "$RUNNER_TEMP/conn.c" -o "$RUNNER_TEMP/conn" \
            -I"$PWD/include" -L"$PWD/lib/kvspace" -lkvspace
          DYLD_FALLBACK_LIBRARY_PATH="$PWD/lib:$PWD/lib/kvspace" "$RUNNER_TEMP/conn"
      - name: 打包 ABI 产物
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-darwin-arm64"
          mkdir -p "$d/include/kvlang" "$d/lib/kvspace" "$d/bin"
          # 同 Linux job：`runtime/include/` 已随 c2 归档消失（e927a923）。
          cp -R include/kvlang/. "$d/include/kvlang/"
          cp -R runtimec/include/kvlang/. "$d/include/kvlang/"
          for h in kvspace blockmalloc slotsboxmalloc; do
            [ -d "include/$h" ] && cp -R "include/$h" "$d/include/"
          done
          # 只收**当前构建会产出**的库名，不 `find` 全收（同 Linux job 的理由：
          # `find` 的开放性是残留混进发布包的通道）。
          for lib in libkvlang_runtime libkvlanglayout libkvspace; do
            for f in "lib/$lib".dylib; do
              [ -e "$f" ] && cp -P "$f" "$d/lib/"
            done
          done
          find lib/kvspace -maxdepth 1 -name '*.dylib' -exec cp -P {} "$d/lib/kvspace/" \;
          names=$(find "$d/lib" -maxdepth 1 -type f -name '*.dylib' | sed 's/.*\///;s/\.dylib$//' | sort -u)
          test "$names" = "$(printf 'libkvlang_runtime\nlibkvlanglayout\nlibkvspace')" || {
            echo "发布包 lib/ 出现非预期库："; ls "$d/lib"; exit 1; }
          # byteseek 暂不发（TASK-035），bin/ 只有这两个。
          cp bin/kvlanglayout bin/kvspace "$d/bin/"
          test "$(ls "$d/bin" | sort | tr '\n' ' ')" = "kvlanglayout kvspace " || {
            echo "发布包 bin/ 出现非预期可执行："; ls "$d/bin"; exit 1; }
          # 抹掉构建机绝对路径：lib/ 里各 dylib 的 install-id 与 bin/ 里各可执行
          # 的依赖都落到 @rpath，bin/ 与 lib/ 都能从 tarball 内 lib/ 解析。
          has_rpath() { otool -l "$1" | awk '/cmd LC_RPATH/{f=1} f && /path /{print $2; f=0}' | grep -qx "$2"; }
          add_rpath() {
            has_rpath "$1" "$2" && return 0
            install_name_tool -add_rpath "$2" "$1"
          }
          for lib in "$d"/lib/*.dylib; do
            name=$(basename "$lib")
            cur_id=$(otool -D "$lib" | tail -n +2)
            [ "$cur_id" = "@rpath/$name" ] || install_name_tool -id "@rpath/$name" "$lib"
          done
          # bin/ 里每个可执行：把对 lib/ 下各库的绝对路径依赖改写成 @rpath。
          for exe in "$d"/bin/*; do
            for lib in "$d"/lib/*.dylib; do
              name=$(basename "$lib")
              dep=$(otool -L "$exe" | awk -v n="$name" 'index($1,n){print $1; exit}')
              [ -n "$dep" ] || continue
              case "$dep" in
                @rpath/*) ;;
                *) install_name_tool -change "$dep" "@rpath/$name" "$exe" ;;
              esac
            done
          done
          for f in "$d"/bin/* "$d"/lib/*.dylib; do
            add_rpath "$f" @loader_path/../lib
          done
          otool -L "$d/bin/kvlanglayout"
          printf '{"abi":"%s"}\n' "$v" > "$d/abi-manifest.json"
          tar czf "$d.tar.gz" "$d"
          tar tzf "$d.tar.gz"
          sha256sum "$d.tar.gz" | tee SHA256SUMS-macos
      - name: 自包含冒烟（解包到临时目录运行）
        run: |
          set -euo pipefail
          v="${ABI_VERSION}"
          d="kvlang-abi-$v-darwin-arm64"
          test -e "$d/lib/libkvspace.1.dylib"
          run="$RUNNER_TEMP/rel-smoke"
          rm -rf "$run"; mkdir -p "$run"
          tar xzf "$d.tar.gz" -C "$run" --strip-components=1
          # 同 Linux job：byteseek 摘掉后 stdlib 不在，layout tutorial 文件的前提没了。
          # 改为 vet（不需 stdlib）+ kvspace 写读往返，验包内产物自证可用。
          "$run/bin/kvlanglayout" vet "$GITHUB_WORKSPACE/tutorial/runtimec/01-basics/hello.kv" >/dev/null
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/tmp KVSPACE="shm://$run/rt.shm" \
            "$run/bin/kvspace" mkindex /t/
          # 同 Linux job：断言四个字段，不是「命令没报错」。
          head_out=$(env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME=/tmp KVSPACE="shm://$run/rt.shm" \
            "$run/bin/kvspace" head /t/)
          echo "smoke kvspace head: $head_out"
          echo "$head_out" | grep -q 'bodylen=0'    || { echo "期望 bodylen=0"; exit 1; }
          echo "$head_out" | grep -q 'attrslen=0'   || { echo "期望 attrslen=0"; exit 1; }
          echo "$head_out" | grep -q 'total=16'     || { echo "期望 total=16"; exit 1; }
          echo "$head_out" | grep -q 'padding=zero' || { echo "期望 padding=zero"; exit 1; }
      - name: 上传 dry-run 产物（供合并前核对/重传）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kvlang-abi-${{ env.ABI_VERSION }}-darwin-arm64
          path: |
            kvlang-abi-${{ env.ABI_VERSION }}-darwin-arm64.tar.gz
            SHA256SUMS-macos
      - name: dispatch 发布（tag 输入非空且冒烟通过）
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          gh release upload "${{ inputs.tag }}" \
            "kvlang-abi-${{ inputs.tag }}-darwin-arm64.tar.gz" \
            SHA256SUMS-macos --clobber
      - name: 上传到 release
        if: github.event_name == 'push'
        run: gh release upload "${GITHUB_REF_NAME}" kvlang-abi-*-darwin-*.tar.gz SHA256SUMS-macos --clobber
